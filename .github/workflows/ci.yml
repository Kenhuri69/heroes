name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Qualité statique + moteur + build + gardes-fous — tourne une seule fois.
  # Le smoke Playwright (le plus long) est déporté dans des jobs dédiés
  # parallèles ci-dessous (voir .claude/plans/test-performance-optimization.md).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test          # moteur + contenu : unitaires, property-based, golden replay
      - run: pnpm content:check # validation de tous les paquets de faction (doc 06)

      # Invariant « le moteur ne connaît aucune faction » (README §1) :
      # les IDs de faction ne doivent apparaître que dans data/ (et les tests).
      # Le motif est dérivé de data/factions/index.json (source de vérité) pour
      # rester exhaustif quand une faction est ajoutée. On distingue explicitement
      # les 3 statuts de grep : 0 = un ID trouvé (échec), 1 = aucun (succès),
      # >1 = erreur d'exécution (échec) — sans quoi un grep cassé passerait pour vert.
      - name: Vérifier l'absence d'IDs de faction dans packages/
        run: |
          pattern=$(jq -r '.factions | map("\\b" + . + "\\b") | join("|")' data/factions/index.json)
          echo "motif faction : ${pattern}"
          set +e
          hits=$(grep -rInE "$pattern" packages/ \
            --include='*.ts' --include='*.tsx' --include='*.js' \
            --include='*.cjs' --include='*.mjs' --include='*.json' \
            --exclude-dir=dist --exclude-dir=node_modules)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::ID(s) de faction trouvé(s) dans packages/ :"
            echo "$hits"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::échec de l'exécution de grep (statut ${status})"
            exit 1
          fi
          echo "aucun ID de faction dans packages/ ✓"

      # Invariant design system (UXD-1, plan ux-design-overhaul §3) : les
      # couleurs de l'UI DOM vivent dans ui/tokens.css UNIQUEMENT — aucun
      # littéral #hex / rgb()/rgba() dans les autres feuilles (toujours
      # var(--…)). Même triptyque de statuts grep que le garde-fou faction.
      - name: Vérifier l'absence de couleurs en dur hors tokens.css
        run: |
          set +e
          hits=$(grep -rInE '#[0-9a-fA-F]{3,8}\b|rgba?\(' packages/client/src/ui \
            --include='*.css' --exclude='tokens.css')
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::couleur(s) en dur hors ui/tokens.css :"
            echo "$hits"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::échec de l'exécution de grep (statut ${status})"
            exit 1
          fi
          echo "aucune couleur en dur hors tokens.css ✓"

      - run: pnpm build

      # Budget perf (doc 07 §6) : bundle initial JS+CSS < 800 Ko gzip.
      - name: Budget bundle < 800 Ko gzip
        run: |
          total=$(find packages/client/dist/assets \( -name '*.js' -o -name '*.css' \) -exec sh -c 'gzip -c "$1" | wc -c' _ {} \; | awk '{s+=$1} END {print s}')
          echo "bundle gzip: ${total} octets"
          [ "$total" -le 819200 ]

      # Hygiène de build (R7/P1, doc 12 §10) : `assets/prompts/` est l'ATELIER de
      # génération (gabarits de prompt, planches brutes de `_incoming/`) — jamais
      # lu par le jeu, donc jamais émis dans `dist/`. La liste des noms interdits
      # est DÉRIVÉE de l'arborescence réelle (même esprit que le garde-fou faction
      # dérivé de data/factions/index.json) : un futur gabarit déposé dans
      # `prompts/` est couvert sans toucher ce workflow.
      - name: Vérifier l'absence d'assets de génération dans dist/assets
        run: |
          fail=0
          seen=0
          while IFS= read -r src; do
            seen=$((seen + 1))
            # Nom émis par Vite : <base>-<hash 8>.<ext> (le glob de hash évite de
            # confondre `siege-kit.png` avec `siege-kit-template.png`).
            base=$(basename "$src")
            hits=$(find packages/client/dist/assets -maxdepth 1 -name "${base%.*}-????????.${base##*.}" -printf '%f ')
            if [ -n "$hits" ]; then
              echo "::error::asset de génération émis dans dist/assets : ${src} → ${hits}"
              fail=1
            fi
          done < <(find assets/prompts -type f \( -name '*.png' -o -name '*.jpg' \))
          # Non-vacuité : un garde-fou dérivé de l'arborescence passe « vert » pour
          # de mauvaises raisons si l'arborescence disparaît (répertoire renommé,
          # checkout partiel). On exige au moins une source à confronter.
          if [ "$seen" -eq 0 ]; then
            echo "::error::aucune image trouvée dans assets/prompts/ — garde-fou vacant, vérifier le chemin"
            exit 1
          fi
          [ "$fail" -eq 0 ]
          echo "aucun des ${seen} assets de assets/prompts/ n'est dans dist/assets ✓"

      # Budget d'images (doc 07 §6, R7/P2) — deux bornes chiffrées :
      #  1. poids TOTAL de dist/assets ≤ 96 Mio : mesuré 84 Mio, marge calibrée sur
      #     l'empreinte art de la plus grosse maison livrée (11 Mio) ⇒ une faction
      #     de plus passe, un saut plus gros devient une décision explicite ;
      #  2. plus gros fichier du CHEMIN CRITIQUE ≤ 300 Ko : les images du PREMIER
      #     écran, chargées avant toute interaction (logo `logoUrl` + fond de titre
      #     `titleBackgroundUrl`, cf. render/assets.ts).
      - name: Budget images (dist/assets ≤ 96 Mio, chemin critique ≤ 300 Ko)
        run: |
          total=$(du -sb packages/client/dist/assets | cut -f1)
          echo "dist/assets: ${total} octets"
          [ "$total" -le 100663296 ]
          crit=0
          while IFS= read -r f; do
            size=$(stat -c%s "$f")
            echo "chemin critique: $(basename "$f") ${size} octets"
            if [ "$size" -gt "$crit" ]; then crit=$size; fi
          done < <(find packages/client/dist/assets -maxdepth 1 \
            \( -name 'heroes-master-*.png' -o -name 'title-*.jpg' \))
          if [ "$crit" -eq 0 ]; then
            echo "::error::aucune image du chemin critique trouvée dans dist/assets"
            exit 1
          fi
          [ "$crit" -le 307200 ]

  # Smoke headless sur le build de prod (guideline §7), shardé en 2 lots
  # parallèles + fully-parallel intra-lot (playwright.config.ts). Les tests de
  # throttling FPS (@perf) sont exclus ici — ils mesurent des FPS sous rendu
  # logiciel et deviendraient flaky en concurrence CPU ; ils tournent isolés
  # dans le job `smoke-perf`. Sur PR : noyau `@core` seul (deux vitesses, axe
  # H) ; suite complète sur main (deploy.yml) et à la demande (workflow_dispatch).
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm build

      # Deux vitesses (axe H) : sur une PR on ne joue que le noyau `@core`
      # (retour rapide) ; la suite COMPLÈTE tourne sur `main` (deploy.yml) et à
      # la demande via `workflow_dispatch`. Appel direct de Playwright (le
      # script `pnpm smoke` ne transmet pas les arguments après `--`).
      - run: >
          pnpm exec playwright test --shard=${{ matrix.shard }}/2
          "${{ github.event_name == 'workflow_dispatch' && '--grep-invert=@perf|@e2e' || '--grep=@core' }}"

  # Tests de fluidité (@perf) isolés : mono-worker, seuls sur le runner, pour
  # une mesure FPS non perturbée par la charge parallèle.
  smoke-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm build

      - run: pnpm exec playwright test --project=desktop --grep=@perf --workers=1

  # Harnais E2E (@e2e) : boucle end-to-end complète jouée en UNE session
  # (New Game → exploration → ville → combat → sauvegarde → reload). OPTIONNEL :
  # `continue-on-error` ⇒ ce job tourne et reste VISIBLE sur chaque PR mais ne
  # bloque JAMAIS la fusion (choix : un parcours long est plus sujet au flake que
  # le noyau `@core`, on veut le signal sans le gate). Exclu des runs bloquants
  # (job `smoke` en workflow_dispatch, deploy.yml) via `--grep-invert`.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm build

      - run: pnpm exec playwright test --project=desktop --grep=@e2e
